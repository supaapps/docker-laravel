version: '3.9'
services:

  db:
    image: mysql:8.0.33
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: hello
      MYSQL_ROOT_PASSWORD: password
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 1s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7.0.11
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 2s
      retries: 10

  dependencies:
    build:
      context: .
      target: build
    volumes:
      - ./:/var/www
    entrypoint: ["composer", "install", "--no-plugins", "--no-scripts", "--no-interaction", "--prefer-dist"]

  api:
    build:
      context: .
      target: runtime
    ports:
      - 8080:80
    volumes:
      - ./:/var/www
      - ./vendor:/var/www/vendor:ro,cached
    entrypoint: '/var/www/docker/startup.sh'
    depends_on:
      dependencies:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  queue:
    build:
      context: .
      target: runtime
    entrypoint: "php /var/www/artisan queue:work --tries=5"
    volumes:
      - ./:/var/www
    depends_on:
      dependencies:
        condition: service_completed_successfully
      api:
        condition: service_started

# Run scheduled jobs with: php /var/www/artisan schedule:work
